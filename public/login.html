<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0d"><title>Admin Login | Golden Films</title><style>
:root{color-scheme:dark;--gold:#d8b36a;--muted:#a8a7a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#242019,#090b0d 60%);font:16px/1.5 system-ui,sans-serif;color:#f7f3eb;padding:24px}.card{width:min(100%,440px);padding:clamp(24px,6vw,42px);border:1px solid #4a3d25;border-radius:20px;background:#111312;box-shadow:0 25px 80px #0008}a{color:var(--gold)}.brand{letter-spacing:.2em;color:var(--gold);font-size:12px;font-weight:700}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.15em;margin-top:28px}h1{font:500 clamp(30px,6vw,40px)/1.1 Georgia,serif;margin:8px 0 12px}p{color:var(--muted)}label{display:block;font-size:13px;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #49463e;border-radius:9px;background:#0b0d0c;color:white;font:inherit}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:var(--gold);color:#17130b;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;font-size:14px;margin-top:16px}.links{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:24px}.hint{font-size:12px;border-top:1px solid #34332e;padding-top:16px;margin-top:22px}
</style></head><body><main class="card"><div class="brand">GOLDEN FILMS</div><div class="eyebrow">SECURE AREA</div><h1>Welcome back.</h1><p>Sign in to manage enquiries and website content.</p><form id="login"><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button id="submit" type="submit">Sign in securely</button><div id="status" class="status" role="status" aria-live="polite"></div></form><div class="links"><a href="/">← Back to website</a><a href="/register.html">First-time owner setup</a></div><div class="hint">Admin access requires a configured server API and database. This page never stores your password in the browser.</div></main><script>
const form=document.querySelector('#login'),button=document.querySelector('#submit'),status=document.querySelector('#status');const messages={invalid_credentials:'Email or password is incorrect.',database_not_configured:'Admin service is not connected to a database yet.',admin_login_unavailable:'Admin service is temporarily unavailable.',temporarily_unavailable:'Too many attempts. Wait a while and try again.'};form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Signing in…';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value.trim(),password:form.password.value})});const data=await r.json().catch(()=>({}));if(r.ok&&data.ok){location.assign('/admin.html');return}status.textContent=messages[data.error]||('Sign-in failed ('+r.status+'). Check that the admin API is deployed and configured.')}catch{status.textContent='Could not reach the admin service. Check your connection and try again.'}finally{button.disabled=false}});
</script></body></html>

name: Website checks

on:
  pull_request:
    branches: [main, chore/project-foundation]
  push:
    branches: [main, chore/project-foundation, feat/premium-portfolio]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build production assets
        run: npm run build
